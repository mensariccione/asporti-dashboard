<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Statistiche Ordini</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;color:#2d3748}
header{background:#1e3a5f;color:white;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:1.4rem;display:flex;align-items:center;gap:10px}
header a{color:#bee3f8;text-decoration:none;font-size:.85rem}
header a:hover{text-decoration:underline}
#last-update{font-size:.8rem;opacity:.7}
.container{max-width:1300px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:white;border-radius:12px;padding:18px 22px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.stat-card .label{font-size:.72rem;text-transform:uppercase;color:#718096;letter-spacing:.05em;margin-bottom:6px}
.stat-card .value{font-size:1.7rem;font-weight:700;color:#1e3a5f}
.filter-bar{background:white;border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.filter-bar label{font-size:.9rem;color:#4a5568}
.filter-bar input[type=date]{padding:6px 10px;border:1px solid #cbd5e0;border-radius:8px;font-size:.9rem}
.filter-bar input[type=text]{padding:6px 10px;border:1px solid #cbd5e0;border-radius:8px;font-size:.9rem}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600}
.btn-primary{background:#2d6a9f;color:white}.btn-primary:hover{background:#1e4f7a}
.btn-secondary{background:#e2e8f0;color:#4a5568}.btn-secondary:hover{background:#cbd5e0}
.btn-secondary.active{background:#2d6a9f;color:white}
.section{background:white;border-radius:12px;padding:0;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,.07);overflow:hidden}
.section-header{background:#1e3a5f;color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.section-header h2{font-size:1rem;font-weight:600}
.section-header span.sub{font-size:.85rem;opacity:.8}
.section-header select{padding:5px 8px;border-radius:6px;border:none;font-size:.8rem}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px;margin-bottom:24px}
.chart-box{padding:20px}
.chart-box.full{grid-column:1/-1}
.reports-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;margin-bottom:24px}
.report-table{width:100%;border-collapse:collapse}
.report-table th{background:#edf2f7;padding:10px 16px;text-align:left;font-size:.72rem;color:#4a5568;text-transform:uppercase;position:sticky;top:0}
.report-table td{padding:10px 16px;font-size:.88rem;border-bottom:1px solid #edf2f7}
.report-table tr:last-child td{border-bottom:none}
.report-table tr.data-row{cursor:pointer}
.report-table tr.data-row:hover td{background:#f7fafc}
.rank{font-weight:700;color:#2d6a9f;width:32px;display:inline-block}
.bar-wrap{background:#edf2f7;border-radius:20px;height:7px;margin-top:4px;min-width:60px;max-width:180px}
.bar-fill{background:#2d6a9f;border-radius:20px;height:7px}
.table-scroll{max-height:480px;overflow-y:auto}
.empty{text-align:center;padding:50px;color:#a0aec0}
.loading{text-align:center;padding:50px;color:#a0aec0;font-size:1.05rem}
.err{text-align:center;padding:28px;color:#e53e3e;background:#fff5f5;border-radius:12px;margin:20px 0;font-size:.9rem}
.detail-row{display:none}
.detail-row.open{display:table-row}
.detail-row td{padding:0!important;border-bottom:1px solid #e2e8f0;background:#f7fafc}
.detail-row ul{margin:0;padding:10px 24px;font-size:.85rem}
.refresh-btn{position:fixed;bottom:24px;right:24px;background:#2d6a9f;color:white;border:none;border-radius:50px;padding:14px 22px;cursor:pointer;font-size:1rem;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.refresh-btn:hover{background:#1e3a5f}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.78rem;font-weight:600;background:#bee3f8;color:#2a69ac}
</style>
</head>
<body>
<header>
<h1>📊 Statistiche Ordini</h1>
<div style="display:flex;align-items:center;gap:16px">
<a href="index.html">&larr; Torna alla Dashboard</a>
<span id="last-update"></span>
</div>
</header>
<div class="container">

<div class="filter-bar">
<label>Periodo:</label>
<button class="btn btn-secondary" data-preset="oggi" onclick="applyPreset('oggi')">Oggi</button>
<button class="btn btn-secondary" data-preset="7" onclick="applyPreset('7')">Ultimi 7 giorni</button>
<button class="btn btn-secondary" data-preset="30" onclick="applyPreset('30')">Ultimi 30 giorni</button>
<button class="btn btn-secondary" data-preset="mese" onclick="applyPreset('mese')">Questo mese</button>
<button class="btn btn-secondary active" data-preset="tutto" onclick="applyPreset('tutto')">Tutto</button>
<span style="border-left:1px solid #e2e8f0;height:22px;margin:0 4px"></span>
<input type="date" id="from-date"> &rarr; <input type="date" id="to-date">
<button class="btn btn-primary" onclick="applyCustomRange()">Applica</button>
</div>

<div class="stats" id="stats-cards">
<div class="stat-card"><div class="label">Ordini</div><div class="value" id="stat-ordini">-</div></div>
<div class="stat-card"><div class="label">Incasso</div><div class="value" id="stat-incasso">-</div></div>
<div class="stat-card"><div class="label">Scontrino medio</div><div class="value" id="stat-medio">-</div></div>
<div class="stat-card"><div class="label">Clienti unici</div><div class="value" id="stat-clienti">-</div></div>
<div class="stat-card"><div class="label">Piatti venduti</div><div class="value" id="stat-piatti">-</div></div>
<div class="stat-card"><div class="label">Giorni attivi</div><div class="value" id="stat-giorni">-</div></div>
</div>

<div id="content-area"><div class="loading">Caricamento dati in corso...</div></div>

</div>
<button class="refresh-btn" onclick="loadData(true)">🔄 Aggiorna</button>
<script>

var XVARX = "AIzaSyAIN16ON6lUZ_kAUNbw9PE4pfMDW1nty8Q";
var PROJ = "spiagge2026";
var BASE = "https://firestore.googleapis.com/v1/projects/" + PROJ + "/databases/(default)/documents/";

var allOrdini = [];
var filteredOrdini = [];
var charts = {};
var sortState = { piatti: 'qty', spiagge: 'ordini', clienti: 'spesa' };

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function parseEuro(s){
  if(!s) return 0;
  var n = String(s).replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',', '.');
  return parseFloat(n) || 0;
}
function formatEuro(n){
  return (n||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' \u20ac';
}
function parseDateIT(s){
  if(!s) return null;
  var p = String(s).split('/');
  if(p.length < 3) return null;
  var d = new Date(parseInt(p[2],10), parseInt(p[1],10)-1, parseInt(p[0],10));
  return isNaN(d.getTime()) ? null : d;
}
function fmtDateIT(d){
  if(!d) return '';
  var dd = ('0'+d.getDate()).slice(-2), mm=('0'+(d.getMonth()+1)).slice(-2);
  return dd+'/'+mm+'/'+d.getFullYear();
}
function normalizePhone(raw){
  if(!raw) return '';
  var digits = String(raw).replace(/[^0-9]/g,'');
  if(!digits) return '';
  if(digits.indexOf('00')===0) digits = digits.slice(2);
  if(digits.indexOf('39')===0 && digits.length>10) digits = digits.slice(2);
  return digits;
}
function fVal(fields, name){
  var f = fields ? fields[name] : null;
  if(!f) return '';
  if(f.stringValue!==undefined) return f.stringValue;
  if(f.integerValue!==undefined) return f.integerValue;
  if(f.doubleValue!==undefined) return f.doubleValue;
  return '';
}
function parseDoc(doc){
  var id = doc.name.split('/').pop();
  var f = doc.fields || {};
  var dataGiorno = fVal(f,'data_giorno');
  var totaleStr = fVal(f,'totale');
  var piatti = [];
  if(f.piatti && f.piatti.arrayValue && f.piatti.arrayValue.values){
    piatti = f.piatti.arrayValue.values.map(function(v){
      var pf = (v.mapValue && v.mapValue.fields) || {};
      return {
        descrizione: fVal(pf,'descrizione'),
        prezzo: fVal(pf,'prezzo'),
        quantita: fVal(pf,'quantita'),
        varianti: fVal(pf,'varianti')
      };
    });
  }
  return {
    id: id,
    nome: fVal(f,'nome'),
    telefono: fVal(f,'numero_telefono'),
    telefonoNorm: normalizePhone(fVal(f,'numero_telefono')),
    dataGiorno: dataGiorno,
    dateObj: parseDateIT(dataGiorno),
    orario: fVal(f,'orario'),
    spiaggia: fVal(f,'spiaggia'),
    totale: totaleStr,
    totaleNum: parseEuro(totaleStr),
    timestamp: fVal(f,'timestamp'),
    piatti: piatti
  };
}
async function fetchAllOrders(){
  var all = [];
  var pageToken = null;
  do {
    var url = BASE + 'asporti?pageSize=300&key=' + XVARX + (pageToken ? '&pageToken='+encodeURIComponent(pageToken) : '');
    var res = await fetch(url);
    if(!res.ok) throw new Error('Errore rete: ' + res.status);
    var json = await res.json();
    (json.documents||[]).forEach(function(d){ all.push(parseDoc(d)); });
    pageToken = json.nextPageToken || null;
  } while(pageToken);
  return all;
}

function applyPreset(p){
  document.querySelectorAll('[data-preset]').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.querySelector('[data-preset="'+p+'"]');
  if(btn) btn.classList.add('active');
  var today = new Date(); today.setHours(0,0,0,0);
  var from = null, to = null;
  if(p==='oggi'){ from = today; to = today; }
  else if(p==='7'){ to = today; from = new Date(today); from.setDate(from.getDate()-6); }
  else if(p==='30'){ to = today; from = new Date(today); from.setDate(from.getDate()-29); }
  else if(p==='mese'){ from = new Date(today.getFullYear(), today.getMonth(), 1); to = today; }
  else if(p==='tutto'){ from = null; to = null; }
  document.getElementById('from-date').value = from ? isoDate(from) : '';
  document.getElementById('to-date').value = to ? isoDate(to) : '';
  filterAndRender(from, to);
}
function isoDate(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function applyCustomRange(){
  document.querySelectorAll('[data-preset]').forEach(function(b){ b.classList.remove('active'); });
  var fromV = document.getElementById('from-date').value;
  var toV = document.getElementById('to-date').value;
  var from = fromV ? new Date(fromV+'T00:00:00') : null;
  var to = toV ? new Date(toV+'T00:00:00') : null;
  filterAndRender(from, to);
}
function filterAndRender(from, to){
  filteredOrdini = allOrdini.filter(function(o){
    if(!o.dateObj) return (!from && !to);
    if(from && o.dateObj < from) return false;
    if(to && o.dateObj > to) return false;
    return true;
  });
  renderAll();
}
function renderAll(){
  renderStats();
  renderCharts();
  renderTopPiatti();
  renderClienti();
  renderSpiagge();
}
function renderStats(){
  var n = filteredOrdini.length;
  var incasso = filteredOrdini.reduce(function(s,o){return s+o.totaleNum;},0);
  var telSet = {};
  filteredOrdini.forEach(function(o){ telSet[o.telefonoNorm || ('noTel_'+o.nome)] = true; });
  var giorniSet = {};
  filteredOrdini.forEach(function(o){ if(o.dataGiorno) giorniSet[o.dataGiorno]=true; });
  var piattiTot = 0;
  filteredOrdini.forEach(function(o){ (o.piatti||[]).forEach(function(p){ piattiTot += parseInt(p.quantita||'1',10)||1; }); });
  document.getElementById('stat-ordini').textContent = n;
  document.getElementById('stat-incasso').textContent = formatEuro(incasso);
  document.getElementById('stat-medio').textContent = formatEuro(n ? incasso/n : 0);
  document.getElementById('stat-clienti').textContent = Object.keys(telSet).length;
  document.getElementById('stat-piatti').textContent = piattiTot;
  document.getElementById('stat-giorni').textContent = Object.keys(giorniSet).length;
}

var GIORNI_LABELS = ['Luned\u00EC','Marted\u00EC','Mercoled\u00EC','Gioved\u00EC','Venerd\u00EC','Sabato','Domenica'];
var SLOTS = ['12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30'];
function slotKey(orario){
  if(!orario) return 'Altro';
  var p = String(orario).split(':'), h = parseInt(p[0],10), m = parseInt(p[1]||'0',10), tot = h*60+m;
  if(isNaN(tot) || tot<720 || tot>990) return 'Altro';
  var idx = Math.floor((tot-720)/30), ss = 720+idx*30, sh = Math.floor(ss/60), sm = ss%60;
  return (sh<10?'0':'')+sh+':'+(sm<10?'0':'')+sm;
}
function ensureContentArea(){
  var el = document.getElementById('content-area');
  if(el.dataset.built === '1') return;
  el.dataset.built = '1';
  el.innerHTML =
    '<div class="charts-grid">' +
      '<div class="section chart-box"><h2 style="margin-bottom:14px;color:#1e3a5f">\u{1F4C5} Ordini per giorno della settimana</h2><canvas id="chart-giorni" height="220"></canvas></div>' +
      '<div class="section chart-box"><h2 style="margin-bottom:14px;color:#1e3a5f">\u{23F0} Ordini per fascia oraria</h2><canvas id="chart-orari" height="220"></canvas></div>' +
      '<div class="section chart-box full"><h2 style="margin-bottom:14px;color:#1e3a5f">\u{1F4C8} Andamento ordini nel periodo</h2><canvas id="chart-andamento" height="110"></canvas></div>' +
    '</div>' +
    '<div class="reports-grid">' +
      '<div class="section"><div class="section-header"><h2>\u{1F37D} Piatti pi\u00F9 venduti</h2>' +
        '<div style="display:flex;align-items:center;gap:8px"><span class="sub" id="piatti-sub"></span>' +
        '<select onchange="setSort(\'piatti\', this.value)"><option value="qty">Ordina: Quantit\u00E0</option><option value="rev">Ordina: Incasso</option><option value="nome">Ordina: Nome</option></select></div>' +
        '</div><div class="table-scroll" id="report-piatti"></div></div>' +
      '<div class="section"><div class="section-header"><h2>\u26F1 Spiagge pi\u00F9 attive</h2>' +
        '<div style="display:flex;align-items:center;gap:8px"><span class="sub" id="spiagge-sub"></span>' +
        '<select onchange="setSort(\'spiagge\', this.value)"><option value="ordini">Ordina: N. ordini</option><option value="spesa">Ordina: Incasso</option><option value="spiaggia">Ordina: Nome</option></select></div>' +
        '</div><div class="table-scroll" id="report-spiagge"></div></div>' +
    '</div>' +
    '<div class="section" style="margin-bottom:24px">' +
      '<div class="section-header"><h2>\u{1F464} Clienti (raggruppati per telefono)</h2>' +
      '<div style="display:flex;align-items:center;gap:8px"><span class="sub" id="clienti-sub"></span>' +
      '<select onchange="setSort(\'clienti\', this.value)"><option value="spesa">Ordina: Spesa totale</option><option value="ordini">Ordina: N. ordini</option><option value="ultimo">Ordina: Ultimo ordine</option><option value="nome">Ordina: Nome</option></select></div>' +
      '</div>' +
      '<div style="padding:14px 20px;border-bottom:1px solid #edf2f7"><input type="text" id="clienti-search" placeholder="Cerca per nome o telefono..." style="width:100%;max-width:320px;padding:7px 12px;border:1px solid #cbd5e0;border-radius:8px;font-size:.85rem" oninput="renderClienti()"></div>' +
      '<div class="table-scroll" id="report-clienti"></div>' +
    '</div>';
}
function setSort(table, field){
  sortState[table] = field;
  if(table==='piatti') renderTopPiatti();
  else if(table==='spiagge') renderSpiagge();
  else if(table==='clienti') renderClienti();
}
function renderCharts(){
  ensureContentArea();
  var byDay = [0,0,0,0,0,0,0];
  filteredOrdini.forEach(function(o){
    if(!o.dateObj) return;
    var idx = (o.dateObj.getDay()+6)%7;
    byDay[idx]++;
  });
  var bySlot = {};
  SLOTS.forEach(function(s){ bySlot[s]=0; });
  bySlot['Altro'] = 0;
  filteredOrdini.forEach(function(o){ bySlot[slotKey(o.orario)]++; });
  var slotLabels = SLOTS.concat(['Altro']);
  var slotData = slotLabels.map(function(s){ return bySlot[s]; });

  var byDate = {};
  filteredOrdini.forEach(function(o){
    if(!o.dataGiorno) return;
    if(!byDate[o.dataGiorno]) byDate[o.dataGiorno] = {count:0, dateObj:o.dateObj};
    byDate[o.dataGiorno].count++;
  });
  var dateKeys = Object.keys(byDate).filter(function(k){return byDate[k].dateObj;}).sort(function(a,b){
    return byDate[a].dateObj - byDate[b].dateObj;
  });
  var trendLabels = dateKeys;
  var trendData = dateKeys.map(function(k){ return byDate[k].count; });

  if(charts.giorni) charts.giorni.destroy();
  if(charts.orari) charts.orari.destroy();
  if(charts.andamento) charts.andamento.destroy();

  charts.giorni = new Chart(document.getElementById('chart-giorni'), {
    type: 'bar',
    data: { labels: GIORNI_LABELS, datasets: [{ label: 'Ordini', data: byDay, backgroundColor: '#2d6a9f', borderRadius: 6 }] },
    options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{precision:0}}} }
  });
  charts.orari = new Chart(document.getElementById('chart-orari'), {
    type: 'bar',
    data: { labels: slotLabels, datasets: [{ label: 'Ordini', data: slotData, backgroundColor: '#d69e2e', borderRadius: 6 }] },
    options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{precision:0}}} }
  });
  charts.andamento = new Chart(document.getElementById('chart-andamento'), {
    type: 'line',
    data: { labels: trendLabels, datasets: [{ label: 'Ordini al giorno', data: trendData, borderColor: '#38a169', backgroundColor: 'rgba(56,161,105,.15)', fill:true, tension:.25, pointRadius:2 }] },
    options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{precision:0}}} }
  });
}

function sortList(list, field){
  list.sort(function(a,b){
    var av = a[field], bv = b[field];
    if(field==='nome' || field==='spiaggia'){
      return String(av||'').localeCompare(String(bv||''));
    }
    if(field==='ultimo'){
      return (bv?bv.getTime():0) - (av?av.getTime():0);
    }
    return (bv||0) - (av||0);
  });
  return list;
}
function renderTopPiatti(){
  var map = {};
  filteredOrdini.forEach(function(o){
    (o.piatti||[]).forEach(function(p){
      if(!p.descrizione) return;
      var qty = parseInt(p.quantita||'1',10) || 1;
      if(!map[p.descrizione]) map[p.descrizione] = {nome:p.descrizione, qty:0, rev:0};
      map[p.descrizione].qty += qty;
      map[p.descrizione].rev += parseEuro(p.prezzo) * qty;
    });
  });
  var list = Object.keys(map).map(function(k){ return map[k]; });
  sortList(list, sortState.piatti);
  var maxQty = list.length ? Math.max.apply(null, list.map(function(x){return x.qty;})) : 1;
  var html = '';
  if(list.length === 0){
    html = '<div class="empty">Nessun dato nel periodo</div>';
  } else {
    html = '<table class="report-table"><thead><tr><th>#</th><th>Piatto</th><th>Qt\u00E0</th><th>Incasso</th></tr></thead><tbody>';
    list.forEach(function(a,i){
      var pct = Math.round((a.qty/maxQty)*100);
      html += '<tr><td><span class="rank">'+(i+1)+'</span></td>';
      html += '<td>'+escapeHtml(a.nome)+'<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%"></div></div></td>';
      html += '<td><span class="badge">'+a.qty+'</span></td>';
      html += '<td>'+formatEuro(a.rev)+'</td></tr>';
    });
    html += '</tbody></table>';
  }
  document.getElementById('report-piatti').innerHTML = html;
  document.getElementById('piatti-sub').textContent = list.length + ' piatti distinti';
}
function renderSpiagge(){
  var map = {};
  filteredOrdini.forEach(function(o){
    var s = o.spiaggia || 'non specificata';
    if(!map[s]) map[s] = {spiaggia:s, ordini:0, spesa:0};
    map[s].ordini++;
    map[s].spesa += o.totaleNum;
  });
  var list = Object.keys(map).map(function(k){ return map[k]; });
  sortList(list, sortState.spiagge);
  var maxOrd = list.length ? Math.max.apply(null, list.map(function(x){return x.ordini;})) : 1;
  var html = '';
  if(list.length === 0){
    html = '<div class="empty">Nessun dato nel periodo</div>';
  } else {
    html = '<table class="report-table"><thead><tr><th>#</th><th>Spiaggia</th><th>Ordini</th><th>Incasso</th></tr></thead><tbody>';
    list.forEach(function(s,i){
      var pct = Math.round((s.ordini/maxOrd)*100);
      html += '<tr><td><span class="rank">'+(i+1)+'</span></td>';
      html += '<td>'+escapeHtml(s.spiaggia)+'<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%;background:#d69e2e"></div></div></td>';
      html += '<td><span class="badge">'+s.ordini+'</span></td>';
      html += '<td>'+formatEuro(s.spesa)+'</td></tr>';
    });
    html += '</tbody></table>';
  }
  document.getElementById('report-spiagge').innerHTML = html;
  document.getElementById('spiagge-sub').textContent = list.length + ' spiagge distinte';
}
function renderClienti(){
  var searchEl = document.getElementById('clienti-search');
  var search = searchEl ? searchEl.value.trim().toLowerCase() : '';
  var searchDigits = search.replace(/[^0-9]/g,'');
  var map = {};
  filteredOrdini.forEach(function(o){
    var key = o.telefonoNorm || ('__noTel__' + (o.nome||'sconosciuto'));
    if(!map[key]) map[key] = {tel: o.telefonoNorm, telRaw:o.telefono, nome:o.nome||'', ordini:0, spesa:0, ultimo:null, storico:[]};
    var c = map[key];
    if(o.nome) c.nome = o.nome;
    c.ordini++;
    c.spesa += o.totaleNum;
    if(!c.ultimo || (o.dateObj && (!c.ultimo || o.dateObj > c.ultimo))) c.ultimo = o.dateObj;
    c.storico.push(o);
  });
  var list = Object.keys(map).map(function(k){ return map[k]; });
  if(search){
    list = list.filter(function(c){
      var nomeMatch = (c.nome||'').toLowerCase().indexOf(search)>-1;
      var telMatch = searchDigits.length>0 && (c.tel||'').indexOf(searchDigits)>-1;
      var telRawMatch = (c.telRaw||'').toLowerCase().indexOf(search)>-1;
      return nomeMatch || telMatch || telRawMatch;
    });
  }
  sortList(list, sortState.clienti);
  var maxSpesa = list.length ? Math.max.apply(null, list.map(function(x){return x.spesa;})) : 1;
  var html = '';
  if(list.length === 0){
    html = '<div class="empty">Nessun cliente trovato</div>';
  } else {
    html = '<table class="report-table"><thead><tr><th>#</th><th>Cliente</th><th>Telefono</th><th>Ordini</th><th>Spesa totale</th><th>Media</th><th>Ultimo ordine</th></tr></thead><tbody>';
    list.forEach(function(c,i){
      var pct = Math.round((c.spesa/maxSpesa)*100);
      var rid = 'cli-'+i;
      html += '<tr class="data-row" onclick="toggleCliente(\''+rid+'\')"><td><span class="rank">'+(i+1)+'</span></td>';
      html += '<td>'+escapeHtml(c.nome||'\u2014')+'<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%;background:#38a169"></div></div></td>';
      html += '<td>'+escapeHtml(c.tel||'sconosciuto')+'</td>';
      html += '<td><span class="badge">'+c.ordini+'</span></td>';
      html += '<td><strong>'+formatEuro(c.spesa)+'</strong></td>';
      html += '<td>'+formatEuro(c.spesa/c.ordini)+'</td>';
      html += '<td>'+(c.ultimo?fmtDateIT(c.ultimo):'-')+'</td></tr>';
      html += '<tr class="detail-row" id="detail-'+rid+'"><td colspan="7"><ul>';
      c.storico.slice().sort(function(a,b){ return (b.dateObj||0) - (a.dateObj||0); }).forEach(function(o){
        html += '<li>'+escapeHtml(o.dataGiorno||'-')+' &middot; '+escapeHtml(o.orario||'-')+' &middot; '+formatEuro(o.totaleNum)+' &middot; spiaggia '+escapeHtml(o.spiaggia||'-')+'</li>';
      });
      html += '</ul></td></tr>';
    });
    html += '</tbody></table>';
  }
  document.getElementById('report-clienti').innerHTML = html;
  document.getElementById('clienti-sub').textContent = list.length + ' clienti distinti';
}
function toggleCliente(rid){
  var el = document.getElementById('detail-'+rid);
  if(el) el.classList.toggle('open');
}
async function loadData(force){
  try {
    if(force || allOrdini.length === 0){
      document.getElementById('content-area').innerHTML = '<div class="loading">Caricamento dati in corso...</div>';
      document.getElementById('content-area').dataset.built = '';
      allOrdini = await fetchAllOrders();
    }
    document.getElementById('last-update').textContent = 'Aggiornato: ' + new Date().toLocaleString('it-IT');
    applyPreset('tutto');
  } catch(e){
    document.getElementById('content-area').innerHTML = '<div class="err">Errore nel caricamento dati: ' + escapeHtml(e.message) + '</div>';
  }
}
loadData();
</script>
