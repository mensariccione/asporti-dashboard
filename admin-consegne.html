<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🛠 Gestione Consegne</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f0f2f5;color:#222;padding:0 0 40px}
.topbar{background:#1a2e44;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:1.2rem;font-weight:700}
.topbar .meta{font-size:.85rem;opacity:.8}
.stat-cards{display:flex;flex-wrap:wrap;gap:14px;padding:18px 20px 0}
.stat-card{background:#fff;border-radius:10px;padding:14px 20px;flex:1;min-width:140px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.stat-card .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:4px}
.stat-card .value{font-size:1.7rem;font-weight:700;color:#1a2e44}
.section{background:#fff;margin:18px 20px 0;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden}
.section-header{background:#1a2e44;color:#fff;padding:10px 16px;font-size:.95rem;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.slot-subheader{padding:10px 16px;background:#e8edf3;font-size:.85rem;color:#555;display:flex;justify-content:space-between}
.order-card{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f2f5;background:#fff;cursor:grab}
.order-card:last-child{border-bottom:none}
.order-card:active{cursor:grabbing}
.drag-handle{font-size:1.2rem;color:#aaa;flex-shrink:0;padding:2px 4px}
.seq-badge{background:#1a2e44;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.order-info{flex:1;min-width:0}
.order-name{font-weight:600;font-size:.95rem;text-transform:capitalize}
.order-meta{font-size:.8rem;color:#666;margin-top:2px}
.order-total{font-weight:700;color:#1a2e44;white-space:nowrap}
.save-toast{position:fixed;bottom:20px;right:20px;background:#27ae60;color:#fff;padding:10px 18px;border-radius:8px;font-size:.9rem;display:none;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hint{text-align:center;font-size:.78rem;color:#aaa;padding:8px;background:#fafafa;border-top:1px solid #eee}
.btn-refresh{background:#1a2e44;color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.85rem}
.btn-refresh:hover{background:#2c4a6e}
table{width:100%;border-collapse:collapse}
table th{background:#f5f7fa;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#888;padding:8px 14px;border-bottom:2px solid #e8edf3}
table td{padding:8px 14px;font-size:.88rem;border-bottom:1px solid #f0f2f5}
table tr:last-child td{border-bottom:none}
.rank{font-weight:700;color:#aaa;width:28px}
.inc{color:#27ae60;font-weight:600}
.saving .seq-badge{background:#e67e22}
.saved .seq-badge{background:#27ae60}
</style>
</head>
<body>
<div class="topbar">
  <h1>🛠 Gestione Consegne</h1>
  <div class="meta" id="meta">Caricamento...</div>
  <button class="btn-refresh" onclick="loadData()">&#x1F504; Aggiorna</button>
</div>
<div class="stat-cards" id="statCards"></div>
<div id="slots"></div>
<div id="statsSection"></div>
<div class="save-toast" id="toast">✔ Sequenza salvata</div>
<script>
var BASE_URL = "https://firestore.googleapis.com/v1/projects/" + "spiagge2026" + "/databases/(default)/documents/" + "asporti";
var API_KEY = "AIzaSyAIN16ON6lUZ_kAUNbw9PE4pfMDW1nty8Q";
var FETCH_URL = BASE_URL + "?key=" + API_KEY + "&pageSize=300";

function getField(f) {
  if(!f) return "";
  if(f.stringValue !== undefined) return f.stringValue;
  if(f.integerValue !== undefined) return parseInt(f.integerValue);
  if(f.doubleValue !== undefined) return parseFloat(f.doubleValue);
  if(f.booleanValue !== undefined) return f.booleanValue;
  if(f.arrayValue) return (f.arrayValue.values||[]).map(function(v){return getField(v);});
  if(f.mapValue) {
    var obj={};
    var fields=f.mapValue.fields||{};
    Object.keys(fields).forEach(function(k){obj[k]=getField(fields[k]);});
    return obj;
  }
  return "";
}

function todayStr() {
  var d=new Date();
  var dd=String(d.getDate()).padStart(2,"0");
  var mm=String(d.getMonth()+1).padStart(2,"0");
  var yyyy=d.getFullYear();
  return dd+"/"+mm+"/"+yyyy;
}

var SLOT_ORDER=["12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00"];
var allDocs=[];
var toastTimer=null;

function showToast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg;
  t.style.display="block";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.style.display="none";},2500);
}

function loadData(){
  document.getElementById("meta").textContent="Aggiornamento...";
  fetch(FETCH_URL)
  .then(function(r){return r.json();})
  .then(function(data){
    allDocs=[];
    var today=todayStr();
    (data.documents||[]).forEach(function(doc){
      var f=doc.fields||{};
      var dg=getField(f.data_giorno);
      var piatti=getField(f.piatti)||[];
      allDocs.push({
        id: doc.name.split("/").pop(),
        nome: getField(f.nome),
        orario: getField(f.orario),
        spiaggia: getField(f.spiaggia),
        totale: getField(f.totale),
        numero_telefono: getField(f.numero_telefono),
        data_giorno: dg,
        piatti: piatti,
        sequenza: getField(f.sequenza) !== "" ? parseInt(getField(f.sequenza)) : 9999,
        timestamp: getField(f.timestamp)
      });
    });
    var now=new Date();
    var hh=String(now.getHours()).padStart(2,"0");
    var min=String(now.getMinutes()).padStart(2,"0");
    document.getElementById("meta").textContent="Agg. "+hh+":"+min;
    renderAll(today);
  })
  .catch(function(e){
    document.getElementById("meta").textContent="Errore: "+e.message;
  });
}

function renderAll(today) {
  var todayDocs = allDocs.filter(function(d){ return d.data_giorno === today; });
  var allDays = {};
  allDocs.forEach(function(d){ allDays[d.data_giorno] = true; });
  var nDays = Object.keys(allDays).length;
  var totPeriodo = allDocs.reduce(function(s,d){ return s + (parseFloat(d.totale)||0); }, 0);
  var totOggi = todayDocs.reduce(function(s,d){ return s + (parseFloat(d.totale)||0); }, 0);
  // Stat cards
  document.getElementById("statCards").innerHTML =
    statCard("ORDINI OGGI", todayDocs.length) +
    statCard("TOTALE OGGI", totOggi.toFixed(2).replace(".",",") + " €") +
    statCard("ORDINI TOTALI", allDocs.length) +
    statCard("GIORNI ATTIVI", nDays);
  // Slots
  var slotMap={};
  todayDocs.forEach(function(d){
    if(!slotMap[d.orario]) slotMap[d.orario]=[];
    slotMap[d.orario].push(d);
  });
  SLOT_ORDER.forEach(function(slot){
    if(slotMap[slot]) slotMap[slot].sort(function(a,b){return a.sequenza-b.sequenza;});
  });
  var slotsHtml="";
  SLOT_ORDER.forEach(function(slot){
    var orders=slotMap[slot];
    if(!orders||orders.length===0) return;
    var slotTotal=orders.reduce(function(s,d){return s+(parseFloat(d.totale)||0);},0);
    slotsHtml+=
      '<div class="section" id="sec-'+slot+'">'+
      '<div class="section-header">🚐 Partenza '+slot+'</div>'+
      '<div class="slot-subheader"><span>'+orders.length+' '+( orders.length===1?"ordine":"ordini" )+'</span><span>'+slotTotal.toFixed(2).replace(".",",")+' €</span></div>'+
      '<div class="order-list" id="list-'+slot+'">'+
      orders.map(function(o,idx){
        return '<div class="order-card" data-id="'+o.id+'" data-slot="'+slot+'">'+
          '<span class="drag-handle">☰</span>'+
          '<div class="seq-badge">'+( idx+1 )+'</div>'+
          '<div class="order-info">'+
          '<div class="order-name">'+o.nome+'</div>'+
          '<div class="order-meta">🏖 Spiaggia '+o.spiaggia+'</div>'+
          '</div>'+
          '<div class="order-total">'+( parseFloat(o.totale)||0 ).toFixed(2).replace(".",",")+' €</div>'+
          '</div>';
      }).join("")+
      '</div>'+
      '<div class="hint">☰ Trascina per riordinare la sequenza delle consegne</div>'+
      '</div>';
  });
  if(!slotsHtml) slotsHtml='<div style="padding:20px;text-align:center;color:#888">Nessuna consegna per oggi</div>';
  document.getElementById("slots").innerHTML = slotsHtml;
  // Init Sortable
  SLOT_ORDER.forEach(function(slot){
    var el=document.getElementById("list-"+slot);
    if(!el) return;
    Sortable.create(el,{
      animation:150,
      handle:".drag-handle",
      onEnd:function(evt){
        onSortEnd(slot);
      }
    });
  });
  // Stats sections
  renderStats(allDocs);
}

function statCard(label, value) {
  return '<div class="stat-card"><div class="label">'+label+'</div><div class="value">'+value+'</div></div>';
}

function onSortEnd(slot){
  var list=document.getElementById("list-"+slot);
  var cards=list.querySelectorAll(".order-card");
  var badges=list.querySelectorAll(".seq-badge");
  cards.forEach(function(c,i){
    badges[i].textContent=i+1;
    c.classList.add("saving");
    c.classList.remove("saved");
  });
  var promises=[];
  cards.forEach(function(c,i){
    var docId=c.getAttribute("data-id");
    var url=BASE_URL+"/"+docId+"?key="+API_KEY+"&updateMask.fieldPaths=sequenza";
    promises.push(
      fetch(url,{
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({fields:{sequenza:{integerValue:i}}})  
      })
    );
  });
  Promise.all(promises).then(function(){
    cards.forEach(function(c){
      c.classList.remove("saving");
      c.classList.add("saved");
    });
    showToast("✔ Sequenza salvata");
  }).catch(function(e){
    showToast("❌ Errore: "+e.message);
  });
}

function renderStats(docs){
  // Articoli piu venduti
  var artMap={};
  docs.forEach(function(d){
    (d.piatti||[]).forEach(function(p){
      var desc=p.descrizione||"";
      var qty=parseInt(p.quantita)||1;
      var pr=parseFloat(p.prezzo)||0;
      if(!artMap[desc]) artMap[desc]={qty:0,inc:0};
      artMap[desc].qty+=qty;
      artMap[desc].inc+=pr*qty;
    });
  });
  var artArr=Object.keys(artMap).map(function(k){return {desc:k,qty:artMap[k].qty,inc:artMap[k].inc};});
  artArr.sort(function(a,b){return b.qty-a.qty;});
  var artRows=artArr.slice(0,15).map(function(a,i){
    return '<tr><td class="rank">'+( i+1 )+'</td><td>'+a.desc+'</td><td>'+a.qty+'</td><td class="inc">'+a.inc.toFixed(2).replace(".",",")+' €</td></tr>';
  }).join("");
  // Top clienti
  var cliMap={};
  docs.forEach(function(d){
    var key=d.nome+" ("+d.numero_telefono+")";
    if(!cliMap[key]) cliMap[key]={ordini:0,spesa:0};
    cliMap[key].ordini++;
    cliMap[key].spesa+=parseFloat(d.totale)||0;
  });
  var cliArr=Object.keys(cliMap).map(function(k){return {nome:k,ordini:cliMap[k].ordini,spesa:cliMap[k].spesa};});
  cliArr.sort(function(a,b){return b.spesa-a.spesa;});
  var cliRows=cliArr.slice(0,15).map(function(c,i){
    return '<tr><td class="rank">'+( i+1 )+'</td><td>'+c.nome+'</td><td>'+c.ordini+'</td><td class="inc">'+c.spesa.toFixed(2).replace(".",",")+' €</td></tr>';
  }).join("");
  // Spiagge
  var spMap={};
  docs.forEach(function(d){
    var sp=d.spiaggia||"N/D";
    if(!spMap[sp]) spMap[sp]={ordini:0,inc:0};
    spMap[sp].ordini++;
    spMap[sp].inc+=parseFloat(d.totale)||0;
  });
  var spArr=Object.keys(spMap).map(function(k){return {sp:k,ordini:spMap[k].ordini,inc:spMap[k].inc};});
  spArr.sort(function(a,b){return b.ordini-a.ordini;});
  var spRows=spArr.slice(0,15).map(function(s,i){
    return '<tr><td class="rank">'+( i+1 )+'</td><td>'+s.sp+'</td><td>'+s.ordini+'</td><td class="inc">'+s.inc.toFixed(2).replace(".",",")+' €</td></tr>';
  }).join("");
  document.getElementById("statsSection").innerHTML=
    '<div class="section" style="margin-top:18px">'+
    '<div class="section-header">🍽 Articoli più venduti <span style="font-size:.8rem;opacity:.7">'+artArr.length+' articoli distinti</span></div>'+
    '<table><thead><tr><th>#</th><th>Articolo</th><th>Qtà</th><th>Incasso</th></tr></thead><tbody>'+artRows+'</tbody></table>'+
    '</div>'+
    '<div class="section" style="margin-top:14px">'+
    '<div class="section-header">👤 Top clienti per spesa <span style="font-size:.8rem;opacity:.7">'+cliArr.length+' clienti distinti</span></div>'+
    '<table><thead><tr><th>#</th><th>Cliente</th><th>Ordini</th><th>Spesa totale</th></tr></thead><tbody>'+cliRows+'</tbody></table>'+
    '</div>'+
    '<div class="section" style="margin-top:14px">'+
    '<div class="section-header">⛱ Spiagge più attive <span style="font-size:.8rem;opacity:.7">'+spArr.length+' spiagge distinte</span></div>'+
    '<table><thead><tr><th>#</th><th>Spiaggia</th><th>Ordini</th><th>Incasso</th></tr></thead><tbody>'+spRows+'</tbody></table>'+
    '</div>';
}

loadData();
</script>
</body>
</html>
