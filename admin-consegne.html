<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🛠 Gestione Consegne</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f0f2f5;color:#222;min-height:100vh}
.topbar{background:#1a2e44;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:1.2rem;font-weight:700}
.topbar .meta{font-size:.85rem;opacity:.8}
.tabs{display:flex;background:#122030;padding:0 20px}
.tab-btn{padding:12px 24px;color:rgba(255,255,255,.6);cursor:pointer;border:none;background:none;font-size:.95rem;font-weight:600;border-bottom:3px solid transparent;transition:all .2s}
.tab-btn.active{color:#fff;border-bottom-color:#4a9eff}
.tab-btn:hover{color:#fff}
.tab-panel{display:none;padding-bottom:40px}
.tab-panel.active{display:block}
.section{background:#fff;margin:18px 20px 0;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden}
.section-header{background:#1a2e44;color:#fff;padding:10px 16px;font-size:.95rem;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.slot-subheader{padding:10px 16px;background:#e8edf3;font-size:.85rem;color:#555;display:flex;justify-content:space-between}
.order-card{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f2f5;background:#fff;cursor:grab}
.order-card:last-child{border-bottom:none}
.order-card:active{cursor:grabbing}
.drag-handle{font-size:1.2rem;color:#aaa;flex-shrink:0;padding:2px 4px}
.seq-badge{background:#1a2e44;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.order-info{flex:1;min-width:0}
.order-name{font-weight:600;font-size:.95rem;text-transform:capitalize}
.order-meta{font-size:.8rem;color:#666;margin-top:2px}
.order-total{font-weight:700;color:#1a2e44;white-space:nowrap}
.hint{text-align:center;font-size:.78rem;color:#aaa;padding:8px;background:#fafafa;border-top:1px solid #eee}
.btn{background:#1a2e44;color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.85rem}
.btn:hover{background:#2c4a6e}
.btn-sm{padding:6px 14px;font-size:.82rem}
.save-toast{position:fixed;bottom:20px;right:20px;background:#27ae60;color:#fff;padding:10px 18px;border-radius:8px;font-size:.9rem;display:none;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.2)}
table{width:100%;border-collapse:collapse}
table th{background:#f5f7fa;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:#666;padding:9px 14px;border-bottom:2px solid #e8edf3;white-space:nowrap}
table th.sortable{cursor:pointer;user-select:none}
table th.sortable:hover{background:#eaeff5;color:#1a2e44}
table th.sort-active{color:#1a2e44;font-weight:700}
.sort-arrow{margin-left:4px;font-size:.8rem;opacity:.5}
.sort-arrow.active{opacity:1;color:#4a9eff}
table td{padding:9px 14px;font-size:.88rem;border-bottom:1px solid #f0f2f5}
table tr:last-child td{border-bottom:none}
.rank{font-weight:700;color:#aaa;width:28px}
.inc{color:#27ae60;font-weight:600}
.saving .seq-badge{background:#e67e22}
.saved .seq-badge{background:#27ae60}
.date-filter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px 0}
.date-filter label{font-size:.85rem;color:#555;font-weight:600}
.date-filter input[type=date]{border:1px solid #ddd;border-radius:6px;padding:6px 10px;font-size:.85rem}
.stat-summary{display:flex;flex-wrap:wrap;gap:12px;padding:16px 20px 0}
.stat-card{background:#fff;border-radius:10px;padding:12px 18px;flex:1;min-width:130px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.stat-card .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:3px}
.stat-card .value{font-size:1.5rem;font-weight:700;color:#1a2e44}
.empty{padding:20px;text-align:center;color:#888}
.table-footer{padding:10px 14px;background:#fafafa;border-top:1px solid #eee;text-align:center}
.btn-expand{background:none;border:1px solid #1a2e44;color:#1a2e44;border-radius:6px;padding:5px 14px;cursor:pointer;font-size:.82rem;font-weight:600}
.btn-expand:hover{background:#1a2e44;color:#fff}
tr.hidden-row{display:none}
</style>
</head>
<body>
<div class="topbar">
  <h1>🛠 Gestione Consegne</h1>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="meta" id="meta">Caricamento...</span>
    <button class="btn" onclick="loadData()">🔄 Aggiorna</button>
  </div>
</div>
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('consegne',this)">🚐 Consegne</button>
  <button class="tab-btn" onclick="showTab('stats',this)">📊 Statistiche</button>
</div>
<div class="tab-panel active" id="tab-consegne"><div id="slots"></div></div>
<div class="tab-panel" id="tab-stats">
  <div class="date-filter">
    <label>Dal</label><input type="date" id="dateFrom">
    <label>al</label><input type="date" id="dateTo">
    <button class="btn btn-sm" onclick="renderStats()">🔍 Filtra</button>
    <button class="btn btn-sm" style="background:#555" onclick="setToday()">📅 Oggi</button>
    <button class="btn btn-sm" style="background:#555" onclick="setAll()">Tutti</button>
  </div>
  <div class="stat-summary" id="statSummary"></div>
  <div id="statsSection"></div>
</div>
<div class="save-toast" id="toast"></div>
<script>
var BASE_URL="https://firestore.googleapis.com/v1/projects/"+"spiagge2026"+"/databases/(default)/documents/"+"asporti";
var API_KEY="AIzaSyAIN16ON6lUZ_kAUNbw9PE4pfMDW1nty8Q";
var FETCH_URL=BASE_URL+"?key="+API_KEY+"&pageSize=300";
var SLOT_ORDER=["12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00"];
var allDocs=[]; var toastTimer=null;
var sortState={art:{col:0,dir:-1},cli:{col:0,dir:-1},sp:{col:0,dir:-1}};
var _artData=[],_cliData=[],_spData=[];
var PREVIEW=15;
function getField(f){
  if(!f)return"";
  if(f.stringValue!==undefined)return f.stringValue;
  if(f.integerValue!==undefined)return parseInt(f.integerValue);
  if(f.doubleValue!==undefined)return parseFloat(f.doubleValue);
  if(f.booleanValue!==undefined)return f.booleanValue;
  if(f.arrayValue)return(f.arrayValue.values||[]).map(function(v){return getField(v);});
  if(f.mapValue){var obj={};Object.keys(f.mapValue.fields||{}).forEach(function(k){obj[k]=getField(f.mapValue.fields[k]);});return obj;}
  return"";
}
function parseEuroTot(s){if(!s)return 0;var n=parseFloat(String(s).replace(/[^\d,.-]/g,"").replace(",","."));return isNaN(n)?0:n;}
  function todayStr(){var d=new Date();return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();}
function dateToInt(s){if(!s)return null;var p=s.split("/");if(p.length!==3)return null;return parseInt(p[2])*10000+parseInt(p[1])*100+parseInt(p[0]);}
function inputToInt(s){if(!s)return null;var p=s.split("-");if(p.length!==3)return null;return parseInt(p[0])*10000+parseInt(p[1])*100+parseInt(p[2]);}
function displayToInput(s){if(!s)return"";var p=s.split("/");return p[2]+"-"+p[1]+"-"+p[0];}
function showToast(msg,color){var t=document.getElementById("toast");t.textContent=msg;t.style.background=color||"#27ae60";t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.display="none";},2500);}
function showTab(name,btn){
  document.querySelectorAll(".tab-panel").forEach(function(p){p.classList.remove("active");});
  document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active");});
  document.getElementById("tab-"+name).classList.add("active");btn.classList.add("active");
  if(name==="stats")renderStats();
}
function setToday(){var td=displayToInput(todayStr());document.getElementById("dateFrom").value=td;document.getElementById("dateTo").value=td;renderStats();}
function setAll(){document.getElementById("dateFrom").value="";document.getElementById("dateTo").value="";renderStats();}
function fetchAllPages(url, pageToken, acc){
  var fullUrl = url + (pageToken ? "&pageToken=" + encodeURIComponent(pageToken) : "");
  return fetch(fullUrl).then(function(r){return r.json();}).then(function(data){
    var docs = data.documents || [];
    var all = acc.concat(docs);
    if (data.nextPageToken) return fetchAllPages(url, data.nextPageToken, all);
    return all;
  });
}
function loadData(){
  document.getElementById("meta").textContent="Aggiornamento...";
  fetchAllPages(FETCH_URL, null, []).then(function(docs){
    allDocs=[];
    docs.forEach(function(doc){
      var f=doc.fields||{};
      allDocs.push({id:doc.name.split('/').pop(),nome:getField(f.nome),orario:getField(f.orario),
      spiaggia:getField(f.spiaggia),totale:getField(f.totale),numero_telefono:getField(f.numero_telefono),
      data_giorno:getField(f.data_giorno),piatti:getField(f.piatti)||[],
      sequenza:getField(f.sequenza)!==""?parseInt(getField(f.sequenza)):9999});
    });
    var now=new Date();
    document.getElementById("meta").textContent="Agg. "+String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    renderSlots();
    if(document.getElementById("tab-stats").classList.contains("active"))renderStats();
  }).catch(function(e){document.getElementById("meta").textContent="Errore: "+e.message;});
}
function renderSlots(){
  var today=todayStr();
  var todayDocs=allDocs.filter(function(d){return d.data_giorno===today;});
  var slotMap={};
  todayDocs.forEach(function(d){if(!slotMap[d.orario])slotMap[d.orario]=[];slotMap[d.orario].push(d);});
  SLOT_ORDER.forEach(function(slot){if(slotMap[slot])slotMap[slot].sort(function(a,b){return a.sequenza-b.sequenza;});});
  var html="";
  SLOT_ORDER.forEach(function(slot){
    var orders=slotMap[slot];if(!orders||!orders.length)return;
    var tot=orders.reduce(function(s,d){return s+(parseEuroTot(d.totale)||0);},0);
    html+='<div class="section"><div class="section-header">🚐 Partenza '+slot+'</div>'+
    '<div class="slot-subheader"><span>'+orders.length+' '+( orders.length===1?"ordine":"ordini")+'</span><span>'+tot.toFixed(2).replace(".",",")+' €</span></div>'+
    '<div class="order-list" id="list-'+slot+'">'+
    orders.map(function(o,i){return '<div class="order-card" data-id="'+o.id+'">'+
      '<span class="drag-handle">☰</span><div class="seq-badge">'+( i+1)+'</div>'+
      '<div class="order-info"><div class="order-name">'+o.nome+'</div><div class="order-meta">🏖 Spiaggia '+o.spiaggia+'</div></div>'+
      '<div class="order-total">'+( parseEuroTot(o.totale)||0).toFixed(2).replace(".",",")+' €</div></div>';}).join("")+
    '</div><div class="hint">☰ Trascina per riordinare la sequenza delle consegne</div></div>';
  });
  if(!html)html='<div class="empty">Nessuna consegna per oggi</div>';
  document.getElementById("slots").innerHTML=html;
  SLOT_ORDER.forEach(function(slot){
    var el=document.getElementById("list-"+slot);if(!el)return;
    Sortable.create(el,{animation:150,handle:".drag-handle",onEnd:function(){onSortEnd(slot);}});
  });
}
function onSortEnd(slot){
  var list=document.getElementById("list-"+slot);
  var cards=list.querySelectorAll(".order-card");
  var badges=list.querySelectorAll(".seq-badge");
  cards.forEach(function(c,i){badges[i].textContent=i+1;c.classList.add("saving");c.classList.remove("saved");});
  var promises=[];
  cards.forEach(function(c,i){
    var url=BASE_URL+"/"+c.getAttribute("data-id")+"?key="+API_KEY+"&updateMask.fieldPaths=sequenza";
    promises.push(fetch(url,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{sequenza:{integerValue:i}}})}));
  });
  Promise.all(promises)
  .then(function(){cards.forEach(function(c){c.classList.remove("saving");c.classList.add("saved");});showToast("✔ Sequenza salvata");})
  .catch(function(e){showToast("❌ Errore: "+e.message,"#e74c3c");});
}
function renderStats(){
  var fromInt=inputToInt(document.getElementById("dateFrom").value);
  var toInt=inputToInt(document.getElementById("dateTo").value);
  var filtered=allDocs.filter(function(d){
    var di=dateToInt(d.data_giorno);if(di===null)return false;
    if(fromInt!==null&&di<fromInt)return false;
    if(toInt!==null&&di>toInt)return false;
    return true;
  });
  var nDays=Object.keys(filtered.reduce(function(acc,d){acc[d.data_giorno]=1;return acc;},{})).length;
  var totale=filtered.reduce(function(s,d){return s+(parseEuroTot(d.totale)||0);},0);
  document.getElementById("statSummary").innerHTML=
    sCard("ORDINI",filtered.length)+sCard("INCASSO TOTALE",totale.toFixed(2).replace(".",",")+' €')+
    sCard("GIORNI",nDays)+sCard("MEDIA/GIORNO",nDays>0?(totale/nDays).toFixed(2).replace(".",",")+' €':"—");
  var artMap={};
  filtered.forEach(function(d){(d.piatti||[]).forEach(function(p){
    var desc=p.descrizione||"?";var qty=parseInt(p.quantita)||1;var pr=parseEuroTot(p.prezzo)||0;
    if(!artMap[desc])artMap[desc]={qty:0,inc:0};
    artMap[desc].qty+=qty;artMap[desc].inc+=pr*qty;
  });});
  _artData=Object.keys(artMap).map(function(k){return{desc:k,qty:artMap[k].qty,inc:artMap[k].inc};});
  var cliMap={};
  filtered.forEach(function(d){var key=d.nome+" ("+d.numero_telefono+")";if(!cliMap[key])cliMap[key]={ordini:0,spesa:0};cliMap[key].ordini++;cliMap[key].spesa+=parseEuroTot(d.totale)||0;});
  _cliData=Object.keys(cliMap).map(function(k){return{nome:k,ordini:cliMap[k].ordini,spesa:cliMap[k].spesa};});
  var spMap={};
  filtered.forEach(function(d){var sp=d.spiaggia||"N/D";if(!spMap[sp])spMap[sp]={ordini:0,inc:0};spMap[sp].ordini++;spMap[sp].inc+=parseEuroTot(d.totale)||0;});
  _spData=Object.keys(spMap).map(function(k){return{sp:k,ordini:spMap[k].ordini,inc:spMap[k].inc};});
  sortState={art:{col:0,dir:-1},cli:{col:0,dir:-1},sp:{col:0,dir:-1}};
  document.getElementById("statsSection").innerHTML="";
  buildTable("art");buildTable("cli");buildTable("sp");
}
function getSorted(id){
  var s=sortState[id];
  var arr=id==="art"?_artData.slice():id==="cli"?_cliData.slice():_spData.slice();
  arr.sort(function(a,b){
    var va,vb;
    if(id==="art"){va=s.col===0?a.qty:a.inc;vb=s.col===0?b.qty:b.inc;}
    else if(id==="cli"){va=s.col===0?a.ordini:a.spesa;vb=s.col===0?b.ordini:b.spesa;}
    else{va=s.col===0?a.ordini:a.inc;vb=s.col===0?b.ordini:b.inc;}
    return s.dir*(vb-va);
  });
  return arr;
}
// sortCol is called from onclick attr with literal table id
function sortCol(id,col){
  if(sortState[id].col===col)sortState[id].dir*=-1;
  else{sortState[id].col=col;sortState[id].dir=-1;}
  refreshTable(id);
}
function toggleExpand(id){
  var tbody=document.getElementById("tbody-"+id);
  var btn=document.getElementById("expand-btn-"+id);
  var hidden=tbody.querySelectorAll("tr.hidden-row");
  if(hidden.length>0){hidden.forEach(function(r){r.classList.remove("hidden-row");});btn.textContent="▲ Comprimi";}
  else{var rows=tbody.querySelectorAll("tr");var total=rows.length;rows.forEach(function(r,i){if(i>=PREVIEW)r.classList.add("hidden-row");});btn.textContent="▼ Mostra tutti ("+total+")";}
}
function makeRows(id,data){
  var rowFn;
  if(id==="art")rowFn=function(a,i){return[i+1,a.desc,a.qty,a.inc.toFixed(2).replace(".",",")+' €'];};
  else if(id==="cli")rowFn=function(c,i){return[i+1,c.nome,c.ordini,c.spesa.toFixed(2).replace(".",",")+' €'];};
  else rowFn=function(r,i){return[i+1,r.sp,r.ordini,r.inc.toFixed(2).replace(".",",")+' €'];};
  return data.map(function(item,i){
    var cells=rowFn(item,i);
    var hidden=(i>=PREVIEW)?" hidden-row":"";
    return '<tr class="'+hidden+'">'+cells.map(function(c,ci){
      return '<td'+(ci===0?' class="rank"':(ci===cells.length-1?' class="inc"':""))+'>'+c+'</td>';
    }).join("")+'</tr>';
  }).join("")||'<tr><td colspan="4" class="empty">Nessun dato</td></tr>';
}
function makeHeaders(id){
  var s=sortState[id];
  var headers,sortCols;
  if(id==="art"){headers=["#","Articolo","Qtà","Incasso"];sortCols=[null,null,0,1];}
  else if(id==="cli"){headers=["#","Cliente","Ordini","Spesa totale"];sortCols=[null,null,0,1];}
  else{headers=["#","Spiaggia","Ordini","Incasso"];sortCols=[null,null,0,1];}
  return headers.map(function(h,i){
    var sc=sortCols[i];
    if(sc===null)return'<th>'+h+'</th>';
    var isActive=(s.col===sc);
    var arrow=isActive?(s.dir===-1?"▼":"▲"):"▼";
    var cls="sortable"+(isActive?" sort-active":"");
    // Pass literal table id in onclick - use data-* attribute approach
    return'<th class="'+cls+'" data-tid="'+id+'" data-col="'+sc+'" onclick="sortCol(this.dataset.tid,+this.dataset.col)">'+h+' <span class="sort-arrow'+(isActive?" active":"")+'">'+arrow+'</span></th>';
  }).join("");
}
function buildTable(id){
  var data=getSorted(id);
  var total=data.length;
  var titles={art:"🍽 Articoli più venduti",cli:"👤 Clienti per spesa",sp:"⛱ Spiagge più attive"};
  var subs={art:total+" articoli distinti",cli:total+" clienti distinti",sp:total+" spiagge distinte"};
  var hasMore=(total>PREVIEW);
  var footer=hasMore
    ?'<div class="table-footer"><button class="btn-expand" id="expand-btn-'+id+'" data-tid="'+id+'" onclick="toggleExpand(this.dataset.tid)">▼ Mostra tutti ('+total+')</button></div>'
    :'';
  var html='<div class="section" style="margin-top:14px" id="table-'+id+'">'+
    '<div class="section-header">'+titles[id]+'<span style="font-size:.8rem;opacity:.7">'+subs[id]+'</span></div>'+
    '<table><thead><tr>'+makeHeaders(id)+'</tr></thead>'+
    '<tbody id="tbody-'+id+'">'+makeRows(id,data)+'</tbody></table>'+
    footer+'</div>';
  document.getElementById("statsSection").insertAdjacentHTML("beforeend",html);
}
function refreshTable(id){
  var data=getSorted(id);
  var total=data.length;
  var el=document.getElementById("table-"+id);if(!el)return;
  el.querySelector("thead tr").innerHTML=makeHeaders(id);
  document.getElementById("tbody-"+id).innerHTML=makeRows(id,data);
  var hasMore=(total>PREVIEW);
  var oldFoot=el.querySelector(".table-footer");
  var footHtml=hasMore
    ?'<div class="table-footer"><button class="btn-expand" id="expand-btn-'+id+'" data-tid="'+id+'" onclick="toggleExpand(this.dataset.tid)">▼ Mostra tutti ('+total+')</button></div>'
    :'';
  if(oldFoot)oldFoot.outerHTML=footHtml;
  else if(hasMore)el.insertAdjacentHTML("beforeend",footHtml);
}
function sCard(label,value){return'<div class="stat-card"><div class="label">'+label+'</div><div class="value">'+value+'</div></div>';}
(function(){
  var td=new Date();
  var s=td.getFullYear()+"-"+String(td.getMonth()+1).padStart(2,"0")+"-"+String(td.getDate()).padStart(2,"0");
  document.getElementById("dateFrom").value=s;document.getElementById("dateTo").value=s;
})();
loadData();
</script>
</body>
</html>
