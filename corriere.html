<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Consegne Oggi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f0f4f8;color:#2d3748;min-height:100vh}
header{background:#1e3a5f;color:white;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.3)}
header h1{font-size:1.2rem}
#last-update{font-size:.75rem;opacity:.7}
.container{max-width:600px;margin:0 auto;padding:16px}
.date-banner{background:#2d6a9f;color:white;border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.date-banner .date{font-size:1.1rem;font-weight:700}
.date-banner .count{font-size:.85rem;opacity:.85}
.slot{background:white;border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.slot-header{background:#1e3a5f;color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.slot-title{font-size:1rem;font-weight:600}
.slot-badge{background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;font-size:.8rem}
.orders-list{display:block}
.orders-list.closed{display:none}
.order-card{border-bottom:1px solid #edf2f7}
.order-card:last-child{border-bottom:none}
.order-main{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s}
.order-main:hover{background:#f7fafc}
.order-time{background:#e2e8f0;color:#4a5568;border-radius:8px;padding:5px 10px;font-size:.85rem;font-weight:700;text-align:center;min-width:58px}
.order-info{flex:1;min-width:0}
.order-name{font-weight:700;font-size:.95rem;color:#1e3a5f;text-transform:capitalize}
.order-beach{color:#718096;font-size:.82rem;margin-top:2px}
.order-total{font-weight:700;color:#276749;white-space:nowrap}
.order-arrow{color:#a0aec0;margin-left:4px;transition:transform .2s;display:inline-block}
.order-arrow.open{transform:rotate(180deg)}
.order-detail{display:none;background:#f7fafc;border-top:1px solid #edf2f7}
.order-detail.open{display:block}
.detail-inner{padding:14px 16px}
.detail-section{margin-bottom:14px}
.detail-label{font-size:.7rem;text-transform:uppercase;color:#718096;letter-spacing:.05em;margin-bottom:8px;font-weight:600}
.piatti-list{list-style:none}
.piatto-item{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #edf2f7;font-size:.88rem}
.piatto-item:last-child{border-bottom:none}
.piatto-qty{background:#2d6a9f;color:white;border-radius:6px;padding:2px 8px;font-weight:700;font-size:.8rem;min-width:28px;text-align:center;flex-shrink:0}
.piatto-desc{flex:1;color:#2d3748;line-height:1.4}
.piatto-var{color:#718096;font-size:.8rem;margin-top:3px;font-style:italic}
.piatto-price{color:#276749;font-weight:600;white-space:nowrap}
.tel-btn{display:flex;align-items:center;gap:10px;background:#25D366;color:white;border-radius:10px;padding:13px 16px;text-decoration:none;font-weight:600;font-size:.9rem;justify-content:center;transition:background .2s;margin-top:4px}
.tel-btn:hover{background:#1aad4f}
.loading{text-align:center;padding:60px}
.spinner{display:inline-block;width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#2d6a9f;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:56px;color:#a0aec0}
.empty-icon{font-size:3rem;margin-bottom:12px}
.err{background:#fff5f5;color:#e53e3e;border-radius:12px;padding:20px;text-align:center;margin:16px 0}
.fab{position:fixed;bottom:20px;right:20px;background:#2d6a9f;color:white;border:none;border-radius:50px;padding:13px 22px;cursor:pointer;font-size:.9rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:100}
.fab:hover{background:#1e3a5f}
</style>
</head>
<body>
<header>
  <h1>&#x1F6F5; Consegne Oggi</h1>
  <span id="last-update">Caricamento...</span>
</header>
<div class="container"><div id="app"><div class="loading"><div class="spinner"></div><p style="margin-top:14px;color:#718096">Caricamento ordini...</p></div></div></div>
<button class="fab" onclick="loadData()">&#x1F504; Aggiorna</button>
<script>
var BASE = "https://firestore.googleapis.com/v1/projects/spiagge2026/databases/(default)/documents/asporti";
var KEY = "AIzaSyAIN16ON6lUZ_kAUNbw9PE4pfMDW1nty8Q";
var URL = BASE + "?key=" + KEY + "&pageSize=300";
var NON_DIGIT = /[^0-9]/g;
var AMP = /&/g, LT = /</g, GT = />/g, QT = /"/g;

function today() {
  var d = new Date();
  return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear();
}

function esc(s) {
  return String(s).replace(AMP,"&amp;").replace(LT,"&lt;").replace(GT,"&gt;").replace(QT,"&quot;");
}

function wa(tel) {
  var n = tel.replace(NON_DIGIT,"");
  return "https://wa.me/" + (n.indexOf("39")===0 ? n : "39"+n);
}

function parse(doc) {
  var f = doc.fields;
  var p = [];
  if (f.piatti && f.piatti.arrayValue && f.piatti.arrayValue.values) {
    p = f.piatti.arrayValue.values.map(function(v){
      var pf = v.mapValue.fields;
      return {
        desc: pf.descrizione ? pf.descrizione.stringValue : "",
        qty: pf.quantita ? pf.quantita.stringValue : "1",
        price: pf.prezzo ? pf.prezzo.stringValue : "",
        var: pf.varianti ? pf.varianti.stringValue : ""
      };
    });
  }
  return {
    id: doc.name.split("/").pop(),
    nome: f.nome ? f.nome.stringValue : "",
    orario: f.orario ? f.orario.stringValue : "",
    spiaggia: f.spiaggia ? f.spiaggia.stringValue : "",
    tel: f.numero_telefono ? f.numero_telefono.stringValue : "",
    totale: f.totale ? f.totale.stringValue : "",
    data: f.data_giorno ? f.data_giorno.stringValue : "",
    piatti: p
  };
}

function renderOrder(o) {
  var did = "d" + o.id;
  var ph = o.piatti.length === 0
    ? '<p style="color:#a0aec0;font-style:italic;padding:8px 0">Nessun piatto</p>'
    : '<ul class="piatti-list">' + o.piatti.map(function(p){
        return '<li class="piatto-item"><span class="piatto-qty">x'+p.qty+'</span>'
          + '<div class="piatto-desc">'+esc(p.desc)+(p.var?'<div class="piatto-var">'+esc(p.var)+'</div>':"")+'</div>'
          + '<span class="piatto-price">'+esc(p.price)+'</span></li>';
      }).join("") + "</ul>";
  var th = o.tel
    ? '<a class="tel-btn" href="'+wa(o.tel)+'" target="_blank">&#x1F4F2; Chiama su WhatsApp: '+esc(o.tel)+"</a>"
    : '<p style="color:#a0aec0;font-style:italic">Nessun numero</p>';
  return '<div class="order-card">'
    + '<div class="order-main" onclick="tog(\"'+did+'\")"'   >'
    + '<div class="order-time">&#x23F0; '+esc(o.orario)+'</div>'
    + '<div class="order-info"><div class="order-name">'+esc(o.nome)+'</div>'
    + '<div class="order-beach">&#x1F3D6; Spiaggia '+esc(o.spiaggia)+'</div></div>'
    + '<div class="order-total">'+esc(o.totale)+'</div>'
    + '<span class="order-arrow" id="a'+did+'">&#9660;</span></div>'
    + '<div class="order-detail" id="'+did+'"><div class="detail-inner">'
    + '<div class="detail-section"><div class="detail-label">&#x1F374; Ordinato</div>'+ph+'</div>'
    + '<div class="detail-section"><div class="detail-label">&#x1F4DE; Contatto</div>'+th+'</div>'
    + '</div></div></div>';
}

function renderSlot(orario, orders) {
  var lid = "l" + orario.replace(":", "");
  return '<div class="slot">'
    + '<div class="slot-header" onclick="tog2(\"'+lid+'\")">' 
    + '<span class="slot-title">&#x1F680; Partenza '+orario+'</span>'
    + '<span class="slot-badge">'+orders.length+' ' + (orders.length===1?"ordine":"ordini") + '</span></div>'
    + '<div class="orders-list" id="'+lid+'">'+orders.map(renderOrder).join("")+'</div></div>';
}

function tog(id) {
  var el = document.getElementById(id);
  var ar = document.getElementById("a"+id);
  if (el) el.classList.toggle("open");
  if (ar) ar.classList.toggle("open");
}

function tog2(lid) {
  var el = document.getElementById(lid);
  if (el) el.classList.toggle("closed");
}

function loadData() {
  fetch(URL)
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data) {
      var oggi = today();
      var ord = (data.documents||[]).map(parse)
        .filter(function(o){ return o.data === oggi; })
        .sort(function(a,b){ return a.orario < b.orario ? -1 : a.orario > b.orario ? 1 : 0; });
      var slots = {};
      ord.forEach(function(o){ if(!slots[o.orario]) slots[o.orario]=[]; slots[o.orario].push(o); });
      var now = new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
      document.getElementById("last-update").textContent = "Agg. " + now;
      var app = document.getElementById("app");
      if (ord.length === 0) {
        app.innerHTML = '<div class="empty"><div class="empty-icon">&#x1F4EB;</div><p>Nessuna consegna per oggi.</p></div>';
        return;
      }
      var banner = '<div class="date-banner"><span class="date">&#x1F4C5; '+oggi+'</span><span class="count">'+ord.length+' consegne</span></div>';
      var html = Object.keys(slots).sort().map(function(or){ return renderSlot(or,slots[or]); }).join("");
      app.innerHTML = banner + html;
    })
    .catch(function(e){
      document.getElementById("app").innerHTML = '<div class="err">&#x274C; Errore: '+e.message+'</div>';
      document.getElementById("last-update").textContent = "Errore";
    });
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
