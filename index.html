<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard Asporti</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;color:#1a202c}
header{background:linear-gradient(135deg,#1e3a5f,#2d6a9f);color:white;padding:20px 30px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:1.6rem}
header span{font-size:.9rem;opacity:.8}
.container{max-width:1100px;margin:30px auto;padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:30px}
.stat-card{background:white;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.07);border-left:5px solid #2d6a9f}
.stat-card .label{font-size:.8rem;color:#718096;text-transform:uppercase;letter-spacing:.05em}
.stat-card .value{font-size:2rem;font-weight:700;color:#1e3a5f;margin-top:4px}
.filters{background:white;border-radius:12px;padding:16px 20px;margin-bottom:24px;box-shadow:0 2px 8px rgba(0,0,0,.07);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.filters label{font-size:.85rem;color:#4a5568;font-weight:600}
.filters input[type=date]{padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:.9rem}
.filters button{padding:8px 18px;background:#2d6a9f;color:white;border:none;border-radius:8px;cursor:pointer;font-size:.9rem}
.filters button:hover{background:#1e3a5f}
.filters button.reset{background:#e2e8f0;color:#4a5568}
.day-group{margin-bottom:28px}
.day-header{background:#1e3a5f;color:white;padding:10px 18px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.day-header h2{font-size:1rem}
.day-header .day-total{font-size:.9rem;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:20px}
.orders-table{width:100%;border-collapse:collapse;background:white;box-shadow:0 2px 8px rgba(0,0,0,.07);border-radius:0 0 10px 10px;overflow:hidden}
.orders-table th{background:#edf2f7;padding:10px 14px;text-align:left;font-size:.8rem;color:#4a5568;text-transform:uppercase;letter-spacing:.05em}
.orders-table td{padding:12px 14px;font-size:.9rem;border-bottom:1px solid #f7fafc;vertical-align:middle}
.orders-table tr.order-row{cursor:pointer}
.orders-table tr.order-row:hover td{background:#ebf4ff}
.orders-table tr:last-child td{border-bottom:none}
.totale-badge{background:#c6f6d5;color:#276749;padding:3px 10px;border-radius:20px;font-weight:600;font-size:.85rem}
.delete-btn{background:none;border:none;cursor:pointer;color:#fc8181;font-size:1.2rem;padding:2px 8px;border-radius:6px;line-height:1}
.delete-btn:hover{background:#fff5f5;color:#e53e3e}
.detail-row{display:none;background:#f7fafc}
.detail-row.open{display:table-row}
.detail-row td{padding:0!important;border-bottom:1px solid #e2e8f0}
.piatti-table{width:100%;border-collapse:collapse}
.piatti-table th{background:#e2e8f0;padding:7px 14px;text-align:left;font-size:.75rem;color:#4a5568;text-transform:uppercase}
.piatti-table td{padding:8px 14px;font-size:.85rem;border-bottom:1px solid #edf2f7}
.piatti-table tr:last-child td{border-bottom:none}
.piatti-empty{padding:12px 14px;color:#a0aec0;font-size:.85rem;font-style:italic}
.empty{text-align:center;padding:60px;color:#a0aec0}
.loading{text-align:center;padding:60px;color:#a0aec0;font-size:1.1rem}
.err{text-align:center;padding:32px;color:#e53e3e;background:#fff5f5;border-radius:12px;margin:20px 0;font-size:.9rem}
.refresh-btn{position:fixed;bottom:24px;right:24px;background:#2d6a9f;color:white;border:none;border-radius:50px;padding:14px 22px;cursor:pointer;font-size:1rem;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.refresh-btn:hover{background:#1e3a5f}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:16px;padding:28px;max-width:380px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center}
.modal h3{font-size:1.2rem;color:#1e3a5f;margin-bottom:10px}
.modal p{color:#4a5568;font-size:.95rem;margin-bottom:20px}
.modal .modal-name{font-weight:700;color:#1e3a5f}
.modal-btns{display:flex;gap:12px;justify-content:center}
.modal-btns button{padding:10px 24px;border:none;border-radius:8px;cursor:pointer;font-size:.95rem;font-weight:600}
.btn-cancel{background:#e2e8f0;color:#4a5568}
.btn-delete{background:#fc8181;color:white}
.btn-delete:hover{background:#e53e3e}
</style>
</head>
<body>
<header>
  <h1>&#127958; Dashboard Asporti</h1>
  <span id="last-update">Caricamento...</span>
</header>
<div class="container">
  <div class="stats">
    <div class="stat-card"><div class="label">Ordini Oggi</div><div class="value" id="stat-oggi">-</div></div>
    <div class="stat-card"><div class="label">Totale Oggi</div><div class="value" id="stat-tot-oggi">-</div></div>
    <div class="stat-card"><div class="label">Ordini Totali</div><div class="value" id="stat-totali">-</div></div>
    <div class="stat-card"><div class="label">Giorni Attivi</div><div class="value" id="stat-giorni">-</div></div>
  </div>
  <div class="filters">
    <label>Filtra:</label>
    <input type="date" id="filter-from">
    <span>&#8594;</span>
    <input type="date" id="filter-to">
    <button onclick="applyFilter()">Filtra</button>
    <button class="reset" onclick="resetFilter()">Tutti</button>
  </div>
  <div id="content"><div class="loading">&#9203; Caricamento...</div></div>
</div>
<button class="refresh-btn" onclick="loadData()">&#128260; Aggiorna</button>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>&#128465; Cancella ordine</h3>
    <p>Eliminare l'ordine di <span class="modal-name" id="modal-name"></span>?<br><small>Azione irreversibile.</small></p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Annulla</button>
      <button class="btn-delete" onclick="confirmDelete()">Elimina</button>
    </div>
  </div>
</div>
<script>
var APIKEY = "AIzaSyAIN16ON6lUZ_kAUNbw9PE4pfMDW1nty8Q";
var PROJ = "spiagge2026";
var BASE = "https://firestore.googleapis.com/v1/projects/" + PROJ + "/databases/(default)/documents";
var allOrdini = [];
var filterFrom = null;
var filterTo = null;
var pendingDeleteId = null;

function parseEuro(s) {
  if (!s) return 0;
  return parseFloat(s.replace(/[^0-9,]/g, "").replace(",", ".")) || 0;
}

function formatEuro(v) {
  return v.toFixed(2).replace(".", ",") + " €";
}

function parseDate(s) {
  if (!s) return null;
  var p = s.split("/");
  if (p.length !== 3) return null;
  return new Date(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
}

function getStr(fields, key) {
  return (fields[key] && fields[key].stringValue) || "";
}

function getArr(fields, key) {
  return (fields[key] && fields[key].arrayValue && fields[key].arrayValue.values) || [];
}

function escapeHtml(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function loadData() {
  document.getElementById("last-update").textContent = "Aggiornamento...";
  var url = BASE + "/asporti?key=" + APIKEY + "&pageSize=300";
  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(data) {
      var docs = data.documents || [];
      allOrdini = docs.map(function(doc) {
        var f = doc.fields || {};
        var id = doc.name.split("/").pop();
        var pArr = getArr(f, "piatti");
        var piatti = pArr.map(function(p) {
          var m = (p.mapValue && p.mapValue.fields) || {};
          return {
            quantita: (m.quantita && (m.quantita.integerValue || m.quantita.stringValue)) || "1",
            descrizione: (m.descrizione && m.descrizione.stringValue) || "",
            prezzo: (m.prezzo && m.prezzo.stringValue) || "",
            varianti: (m.varianti && m.varianti.stringValue) || ""
          };
        }).filter(function(p) { return p.descrizione; });
        return {
          id: id,
          data_giorno: getStr(f, "data_giorno"),
          timestamp: getStr(f, "timestamp"),
          nome: getStr(f, "nome"),
          numero_telefono: getStr(f, "numero_telefono"),
          spiaggia: getStr(f, "spiaggia"),
          orario: getStr(f, "orario"),
          totale: getStr(f, "totale"),
          piatti: piatti
        };
      });
      allOrdini.sort(function(a, b) {
        return b.timestamp.localeCompare(a.timestamp);
      });
      renderAll();
      document.getElementById("last-update").textContent = "Aggiornato: " + new Date().toLocaleString("it-IT");
    })
    .catch(function(e) {
      document.getElementById("content").innerHTML = "<div class=\"err\"><b>Errore:</b><br>" + e.message + "</div>";
      document.getElementById("last-update").textContent = "Errore";
    });
}

function applyFilter() {
  filterFrom = document.getElementById("filter-from").value;
  filterTo = document.getElementById("filter-to").value;
  renderAll();
}

function resetFilter() {
  filterFrom = null;
  filterTo = null;
  document.getElementById("filter-from").value = "";
  document.getElementById("filter-to").value = "";
  renderAll();
}

function toggleDetail(id) {
  var r = document.getElementById("d-" + id);
  if (r) r.classList.toggle("open");
}

function openModal(id, nome) {
  pendingDeleteId = id;
  document.getElementById("modal-name").textContent = nome || "questo ordine";
  document.getElementById("modal").classList.add("open");
}

function closeModal() {
  pendingDeleteId = null;
  document.getElementById("modal").classList.remove("open");
}

function confirmDelete() {
  if (!pendingDeleteId) return;
  var url = BASE + "/asporti/" + pendingDeleteId + "?key=" + APIKEY;
  fetch(url, { method: "DELETE" })
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      closeModal();
      loadData();
    })
    .catch(function(e) { alert("Errore: " + e.message); });
}

document.addEventListener("click", function(e) {
  var btn = e.target.closest(".delete-btn");
  if (btn) {
    e.stopPropagation();
    var id = btn.getAttribute("data-id");
    var nome = btn.getAttribute("data-nome");
    openModal(id, nome);
    return;
  }
  var row = e.target.closest(".order-row");
  if (row) {
    var id = row.getAttribute("data-id");
    toggleDetail(id);
  }
});

function renderAll() {
  var ordini = allOrdini.slice();
  if (filterFrom || filterTo) {
    ordini = ordini.filter(function(o) {
      var d = parseDate(o.data_giorno);
      if (!d) return true;
      if (filterFrom) {
        var fp = filterFrom.split("-");
        var fromD = new Date(parseInt(fp[0],10), parseInt(fp[1],10)-1, parseInt(fp[2],10));
        if (d < fromD) return false;
      }
      if (filterTo) {
        var tp = filterTo.split("-");
        var toD = new Date(parseInt(tp[0],10), parseInt(tp[1],10)-1, parseInt(tp[2],10));
        if (d > toD) return false;
      }
      return true;
    });
  }

  var today = new Date();
  var todayStr = today.getDate().toString().padStart(2,"0") + "/" + (today.getMonth()+1).toString().padStart(2,"0") + "/" + today.getFullYear();
  var oggiOrdini = 0;
  var oggiTot = 0;
  var giorniSet = {};
  allOrdini.forEach(function(o) {
    if (o.data_giorno === todayStr) { oggiOrdini++; oggiTot += parseEuro(o.totale); }
    if (o.data_giorno) giorniSet[o.data_giorno] = true;
  });
  document.getElementById("stat-oggi").textContent = oggiOrdini;
  document.getElementById("stat-tot-oggi").textContent = formatEuro(oggiTot);
  document.getElementById("stat-totali").textContent = allOrdini.length;
  document.getElementById("stat-giorni").textContent = Object.keys(giorniSet).length;

  if (ordini.length === 0) {
    document.getElementById("content").innerHTML = "<div class=\"empty\">Nessun ordine trovato.</div>";
    return;
  }

  var byDay = {};
  var dayOrder = [];
  ordini.forEach(function(o) {
    var day = o.data_giorno || "Senza data";
    if (!byDay[day]) { byDay[day] = []; dayOrder.push(day); }
    byDay[day].push(o);
  });

  var html2 = "";
  dayOrder.forEach(function(day) {
    var list = byDay[day];
    var dayTot = 0;
    list.forEach(function(o) { dayTot += parseEuro(o.totale); });
    html2 += "<div class=\"day-group\">";
    html2 += "<div class=\"day-header\"><h2>" + escapeHtml(day) + "</h2><span class=\"day-total\">Totale: " + formatEuro(dayTot) + "</span></div>";
    html2 += "<table class=\"orders-table\"><thead><tr><th>Orario</th><th>Nome</th><th>Tel</th><th>Spiaggia</th><th>Totale</th><th></th></tr></thead><tbody>";
    list.forEach(function(o) {
      html2 += "<tr class=\"order-row\" data-id=\"" + o.id + "\">";
      html2 += "<td>" + escapeHtml(o.orario || "-") + "</td>";
      html2 += "<td>" + escapeHtml(o.nome || "-") + "</td>";
      html2 += "<td>" + escapeHtml(o.numero_telefono || "-") + "</td>";
      html2 += "<td>" + escapeHtml(o.spiaggia || "-") + "</td>";
      html2 += "<td><span class=\"totale-badge\">" + escapeHtml(o.totale || "-") + "</span></td>";
      html2 += "<td><button class=\"delete-btn\" data-id=\"" + o.id + "\" data-nome=\"" + escapeHtml(o.nome) + "\">&#10005;</button></td>";
      html2 += "</tr>";
      html2 += "<tr class=\"detail-row\" id=\"d-" + o.id + "\"><td colspan=\"6\">";
      if (o.piatti && o.piatti.length > 0) {
        html2 += "<table class=\"piatti-table\"><thead><tr><th>Qt</th><th>Descrizione</th><th>Prezzo</th><th>Varianti</th></tr></thead><tbody>";
        o.piatti.forEach(function(p) {
          html2 += "<tr><td>" + escapeHtml(p.quantita) + "</td><td>" + escapeHtml(p.descrizione) + "</td><td>" + escapeHtml(p.prezzo) + "</td><td>" + escapeHtml(p.varianti || "-") + "</td></tr>";
        });
        html2 += "</tbody></table>";
      } else {
        html2 += "<div class=\"piatti-empty\">Nessun piatto registrato per questo ordine.</div>";
      }
      html2 += "</td></tr>";
    });
    html2 += "</tbody></table></div>";
  });
  document.getElementById("content").innerHTML = html2;
}

loadData();
</script>
</body>
</html>
